<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jednotky v 8 smeroch</title>
<style>
  body { margin: 0; padding: 16px; background: #3a4a2a; color: #eee; font: 14px sans-serif; }
  canvas { image-rendering: pixelated; display: block; margin-bottom: 12px; }
</style>
</head>
<body>
<div>Snímky: postoj · chôdza 1–4 · útok &nbsp; | &nbsp; riadky: V, JV, J, JZ, Z, SZ, S, SV</div>
<canvas id="sheet"></canvas>
<div>Živá chôdza (hore) a porovnanie so starým rytierom a kartou rasy</div>
<canvas id="live"></canvas>
<script src="../js/knight-art.js"></script>
<script src="../js/archer-art.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/orcs8.js"></script>
<script>
initSprites(); initOrcSprites();
const U = new URLSearchParams(location.search).get('u') || 'soldier'; // napr. ?u=footArcher
const Z = 4, set = SPR[U + '8'], W = set[0].idle.w, H = set[0].idle.h;
const sh = document.getElementById('sheet'), sx = sh.getContext('2d');
sh.width = W * 8 * Z; sh.height = H * 8 * Z; sx.imageSmoothingEnabled = false;
set.forEach((v, d) => [v.idle, ...v.walk, ...v.atk].forEach((f, i) => sx.drawImage(f.c, i * W * Z, d * H * Z, W * Z, H * Z)));
const lv = document.getElementById('live'), lx = lv.getContext('2d');
lv.width = 640; lv.height = 300; lx.imageSmoothingEnabled = false;
let dist = 0, last = performance.now();
function loop(now) {
  const dt = Math.max(0, now - last) / 1000; last = now; // prvý snímok môže prísť s časom pred štartom dist += dt * 26;
  lx.fillStyle = '#4c5e34'; lx.fillRect(0, 0, lv.width, lv.height);
  set.forEach((v, d) => {
    const f = v.walk[Math.floor(dist / set.stride) % 4];
    lx.drawImage(f.c, 10 + d * 76, 10, W * 2, H * 2);
    lx.drawImage(v.atk[Math.floor(now / 300) % v.atk.length].c, 10 + d * 76, 70, W * 2, H * 2);
  });
  const o = SPR[U][Math.floor(dist / 9) % 2], r = SPR.race_humans[0];
  lx.drawImage(o.c, 20, 150, o.w * 4, o.h * 4);
  lx.drawImage(set[6].walk[Math.floor(dist / set.stride) % 4].c, 90, 110, W * 4, H * 4);
  lx.drawImage(set[2].walk[Math.floor(dist / set.stride) % 4].c, 230, 110, W * 4, H * 4);
  lx.drawImage(r.c, 380, 150, r.w * 4, r.h * 4);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
